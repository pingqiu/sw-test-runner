#cloud-config
# Smoke tool set only. No credentials, no lab or share access, no services beyond the idle guard.
package_update: true
packages:
  - ca-certificates
  - curl
  - jq
  - fio
  - nvme-cli
  - dmsetup
  - linux-tools-azure
  - build-essential
  - python3
write_files:
  # needrestart list-only: a late package upgrade must not restart services mid-session (S2 -az lesson)
  - path: /etc/needrestart/conf.d/50-standing.conf
    content: |
      $nrconf{restart} = 'l';
  - path: /usr/local/sbin/standing-idle-guard
    permissions: "0755"
    content: |
      #!/bin/bash
      # Active = an established SSH connection or a job marker <run>/job-* (a CI job must write one while it runs).
      # The idle clock lives in /run, so it restarts at every boot. Idle for ${idle_minutes} min -> stop.
      # Fail closed: if activity cannot be inspected, never stop (log UNKNOWN).
      set -u
      run=$${STANDING_RUN_DIR:-/run/standing}
      st=$run/last-active
      mkdir -p "$run" || { logger -t standing-idle-guard "UNKNOWN: cannot create $run, not stopping"; exit 0; }
      [ -e "$st" ] || { touch "$st"; exit 0; }
      if ! ssh_out=$(ss -Htn state established '( sport = :22 )'); then logger -t standing-idle-guard "UNKNOWN: ss failed, not stopping"; exit 0; fi
      if ! job_out=$(find "$run" -maxdepth 1 -name 'job-*'); then logger -t standing-idle-guard "UNKNOWN: marker scan failed, not stopping"; exit 0; fi
      if [ -n "$ssh_out" ] || [ -n "$job_out" ]; then touch "$st"; exit 0; fi
      last=$(stat -c %Y "$st") || { logger -t standing-idle-guard "UNKNOWN: idle clock unreadable, not stopping"; exit 0; }
      idle=$(( $(date +%s) - last ))
      [ "$idle" -ge $(( ${idle_minutes} * 60 )) ] || exit 0
      logger -t standing-idle-guard "idle $idle s (no SSH, no job marker): stopping"
      systemctl poweroff
  - path: /etc/systemd/system/standing-idle-guard.service
    content: |
      [Unit]
      Description=standing box idle guard
      [Service]
      Type=oneshot
      ExecStart=/usr/local/sbin/standing-idle-guard
  - path: /etc/systemd/system/standing-idle-guard.timer
    content: |
      [Unit]
      Description=standing box idle guard every 5 min
      [Timer]
      OnBootSec=10min
      OnUnitActiveSec=5min
      [Install]
      WantedBy=timers.target
runcmd:
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, standing-idle-guard.timer]
