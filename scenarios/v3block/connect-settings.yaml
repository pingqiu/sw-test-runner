# Guest connect settings, measured: what a guest's I/O does while its
# holder is away, under the connect options the scenario declares (env
# guest_connect; empty = plain connect, as the product ships). Two cases on one
# volume:
#   positive: the holder is killed, a guest write is started, the holder is
#     restarted after restart_after seconds; the write must wait and complete;
#   negative: the holder is killed, a guest write is started, the holder stays
#     away; the write's time to fail is measured.
# The measurements are exec results in the bundle (start, end, exit, elapsed);
# the kill and restart are the typed fault operations, recorded in history.
#
name: v3block-connect-settings
timeout: 6h
always_timeout: 5m

env:
  product_src: ""
  runner_src: ""
  weed: ""
  # Every listening port of the run is computed from port_base (v3_run_plan).
  port_base: "21000"
  # The work directory is work_prefix + tag and the NQN prefix carries the tag;
  # empty: the run id without its dashes.
  run_tag: ""
  work_prefix: "/root/connect-run-"
  # The generator. gen_seed is the run's seed; nightly_seed, when a nightly
  # driver drew gen_seed from one, is recorded next to it in the header.
  # The connect options under test (kernel fabrics option names).
  guest_connect: ""
  restart_after: "5"
  # How long a guest write may take before this scenario stops waiting.
  io_wait: "420"
  gen_pool: "c1"
  chunk_path: "/m1"
  lock_dirs_test_only: "true"
  # Every typed operation reads these as vars (work, master_port and
  # weed_filer_grpc_port are set by v3_run_plan; the ops expand them).
  bin_dir: "{{ work }}/bin"
  master: "127.0.0.1:{{ master_port }}"
  filer: "127.0.0.1:{{ weed_filer_grpc_port }}"
  root: "{{ work }}/vol"
  client: "c1"
  own_script: "{{ runner_src }}/scenarios/v3block/m0-own.sh"

topology:
  nodes:
    host:
      is_local: true

phases:
  - name: build
    actions:
      # This run's ports, work directory and NQN prefix, before anything uses
      # them (vars: work, nqn_prefix, the ports).
      - action: v3_run_plan
        node: host
        port_base: "{{ port_base }}"
        volumes: "{{ gen_pool }}"
        run_tag: "{{ run_tag }}"
        work_prefix: "{{ work_prefix }}"
      # Acquire the work directory exclusively: every later step, and the
      # teardown, acts only under the token this returns.
      - action: exec
        node: host
        timeout: 30s
        save_as: owner
        env.OWN: "{{ runner_src }}/scenarios/v3block/m0-own.sh"
        env.WORK: "{{ work }}"
        cmd: bash "$OWN" claim "$WORK"
      - action: exec
        node: host
        timeout: 20m
        env.SRC: "{{ product_src }}"
        env.WORK: "{{ work }}"
        env.V3CTL: "{{ runner_src }}/packs/v3block/v3ctl/main.go"
        cmd: |
          set -eu
          [ -f "$SRC/go.mod" ] || { echo "product_src is not a checkout: $SRC" >&2; exit 2; }
          [ -f "$V3CTL" ] || { echo "runner_src is not this checkout: $V3CTL" >&2; exit 2; }
          mkdir -p "$WORK/bin" "$WORK/log"
          git -C "$SRC" rev-parse HEAD > "$WORK/product.sha"
          for b in blockmaster blockvolume sw-block; do (cd "$SRC" && go build -o "$WORK/bin/$b" ./cmd/$b); done
          d="$SRC/.runner-v3ctl-$$"; mkdir "$d"; tail -n +2 "$V3CTL" > "$d/main.go"
          (cd "$SRC" && go build -o "$WORK/bin/v3ctl" "./$(basename "$d")"); rm -r "$d"
          cat "$WORK/product.sha"

  - name: store
    actions:
      - action: exec
        node: host
        timeout: 5m
        env.OWN: "{{ runner_src }}/scenarios/v3block/m0-own.sh"
        env.TOK: "{{ owner }}"
        env.WEED: "{{ weed }}"
        env.WORK: "{{ work }}"
        env.MP: "{{ weed_master_port }}"
        env.MG: "{{ weed_master_grpc_port }}"
        env.VP: "{{ weed_volume_port }}"
        env.VG: "{{ weed_volume_grpc_port }}"
        env.FP: "{{ weed_filer_port }}"
        env.FG: "{{ weed_filer_grpc_port }}"
        cmd: |
          set -eu
          [ -x "$WEED" ] || { echo "weed is not executable: $WEED" >&2; exit 2; }
          mkdir -p "$WORK/weed/m" "$WORK/weed/v" "$WORK/weed/f"
          "$WEED" version > "$WORK/weed.version"
          # Each daemon is refused if its ports already listen, and ready only when IT holds them.
          bash "$OWN" spawn "$WORK" "$TOK" weed-master $MP $MG -- "$WEED" master -ip=127.0.0.1 -port=$MP -port.grpc=$MG -mdir="$WORK/weed/m" -volumeSizeLimitMB=256 -defaultReplication=000
          bash "$OWN" spawn "$WORK" "$TOK" weed-volume $VP $VG -- "$WEED" volume -ip=127.0.0.1 -port=$VP -port.grpc=$VG -dir="$WORK/weed/v" -master=127.0.0.1:$MP -max=32
          bash "$OWN" spawn "$WORK" "$TOK" weed-filer $FP $FG -- "$WEED" filer -ip=127.0.0.1 -port=$FP -port.grpc=$FG -master=127.0.0.1:$MP -defaultStoreDir="$WORK/weed/f"
          for i in $(seq 1 120); do curl -s -m 5 -F file=@"$WORK/product.sha" "http://127.0.0.1:$FP/m1-probe/" >/dev/null && exit 0; sleep 0.5; done
          echo "filer never accepted a write" >&2; exit 1
  - name: master
    actions:
      # Every name of the pool, declared before the master starts.
      - action: v3_op_spec
        node: host
        volumes: "{{ gen_pool }}"
        spec_path: "{{ work }}/cluster-spec.yaml"
        base_port: "{{ holder_base_port }}"
        nqn_prefix: "{{ nqn_prefix }}"
      - action: exec
        node: host
        timeout: 3m
        save_as: bm_pid
        env.OWN: "{{ runner_src }}/scenarios/v3block/m0-own.sh"
        env.TOK: "{{ owner }}"
        env.WORK: "{{ work }}"
        env.MP: "{{ master_port }}"
        env.FG: "{{ weed_filer_grpc_port }}"
        env.CP: "{{ chunk_path }}"
        cmd: |
          set -eu
          mkdir -p "$WORK/master/authority" "$WORK/master/lifecycle"
          bash "$OWN" spawn "$WORK" "$TOK" blockmaster $MP -- "$WORK/bin/blockmaster" --listen 127.0.0.1:$MP \
            --authority-store "$WORK/master/authority" --lifecycle-store "$WORK/master/lifecycle" \
            --cluster-spec "$WORK/cluster-spec.yaml" --expected-slots-per-volume 1 \
            --workspace-rpc --chunk-filer 127.0.0.1:$FG --chunk-path "$CP"
  - name: volume
    actions:
      - action: v3_op_create
        node: host
        volume: c1
      - action: v3_op_attach
        node: host
        volume: c1
      - action: v3_op_write
        node: host
        volume: c1
        lbas: "0"
        round: w1
  - name: positive
    actions:
      - action: v3_op_kill
        node: host
        process: "blockvolume:0"
      - action: exec
        node: host
        timeout: 30s
        cmd: |
          set -eu
          q="{{ nqn_prefix }}c1"; dev=""
          for c in /sys/class/nvme/nvme*; do [ "$(cat $c/subsysnqn 2>/dev/null)" = "$q" ] || continue; for n in $c/nvme*n*; do [ -e "$n" ] && dev=/dev/$(basename $n); done; done
          [ -n "$dev" ] || { echo "no device for $q" >&2; exit 2; }
          f="{{ work }}/positive"; rm -f "$f".*
          export dev f
          setsid sh -c 's=$(date +%s.%N); head -c 4096 /dev/urandom | dd of=$dev bs=4096 seek=7 count=1 oflag=direct conv=fsync,notrunc status=none 2>"$f.err"; e=$?; echo "$s $(date +%s.%N) $e" > "$f.done"' </dev/null >/dev/null 2>&1 &
          echo "started on $dev"
      - action: sleep
        node: host
        duration: "{{ restart_after }}s"
      - action: v3_op_restart
        node: host
        process: "blockvolume:0"
      - action: exec
        node: host
        timeout: "{{ io_wait }}s"
        save_as: positive_result
        cmd: |
          f="{{ work }}/positive"
          for i in $(seq 1 {{ io_wait }}); do [ -s "$f.done" ] && break; sleep 1; done
          [ -s "$f.done" ] || { echo "positive: guest write still waiting after {{ io_wait }} s"; exit 0; }
          read s e x < "$f.done"
          echo "positive: exit=$x elapsed_s=$(awk "BEGIN{printf \"%.1f\", $e - $s}") err=$(head -c 200 "$f.err" | tr -d '\n')"
  - name: negative
    actions:
      - action: v3_op_kill
        node: host
        process: "blockvolume:0"
      - action: exec
        node: host
        timeout: 30s
        cmd: |
          set -eu
          q="{{ nqn_prefix }}c1"; dev=""
          for c in /sys/class/nvme/nvme*; do [ "$(cat $c/subsysnqn 2>/dev/null)" = "$q" ] || continue; for n in $c/nvme*n*; do [ -e "$n" ] && dev=/dev/$(basename $n); done; done
          [ -n "$dev" ] || { echo "no device for $q" >&2; exit 2; }
          f="{{ work }}/negative"; rm -f "$f".*
          export dev f
          setsid sh -c 's=$(date +%s.%N); head -c 4096 /dev/urandom | dd of=$dev bs=4096 seek=7 count=1 oflag=direct conv=fsync,notrunc status=none 2>"$f.err"; e=$?; echo "$s $(date +%s.%N) $e" > "$f.done"' </dev/null >/dev/null 2>&1 &
          echo "started on $dev"
      - action: exec
        node: host
        timeout: "{{ io_wait }}s"
        save_as: negative_result
        cmd: |
          f="{{ work }}/negative"
          for i in $(seq 1 {{ io_wait }}); do [ -s "$f.done" ] && break; sleep 1; done
          [ -s "$f.done" ] || { echo "negative: guest write still waiting after {{ io_wait }} s"; exit 0; }
          read s e x < "$f.done"
          echo "negative: exit=$x elapsed_s=$(awk "BEGIN{printf \"%.1f\", $e - $s}") err=$(head -c 200 "$f.err" | tr -d '\n')"

  # Only what this run acquired: nothing at all if the claim failed.
  - name: teardown
    always: true
    actions:
      - action: exec
        node: host
        timeout: 3m
        env.OWN: "{{ runner_src }}/scenarios/v3block/m0-own.sh"
        env.TOK: "{{ owner }}"
        env.WORK: "{{ work }}"
        env.NQN: "{{ nqn_prefix }}"
        cmd: bash "$OWN" teardown "$WORK" "$TOK" "$NQN"

  # After teardown, whatever happened: the daemons' logs into the bundle, then
  # the checkers judge the history alone. Their verdicts decide the run.
  - name: judge
    always: true
    actions:
      # Close the history first: its end record says it is the whole run.
      - action: v3_history_end
        node: host
      - action: collect_path
        node: host
        path: "{{ work }}/log"
        name: "daemon-logs"
      - action: collect_path
        node: host
        path: "{{ work }}/vol"
        name: "volume-logs"
      - action: exec
        node: host
        timeout: 2m
        env.HIST: "{{ bundle_dir }}/history.jsonl"
        env.OUT: "{{ artifacts_dir }}/checks.json"
        env.CHECK: "{{ runner_src }}/checkers/history_check.py"
        cmd: python3 -I "$CHECK" "$HIST" --json "$OUT" --product "{{ runner_src }}/packs/v3block/product" --checkers C0
