# R4 documented standalone: NVMe guest on its holder's host, loopback only.
# node-2 starts r1 and the guest; abrupt VM power loss takes both down.
# The controller synchronously fsyncs the intent/ACK ledger over pinned SSH,
# outside that VM. No next write or observed ACK precedes its durable receipt.
# P1: one host power-off, including its guest; the off-host ledger survives.
# P2: automatic persisted BasisFenced/e+1 proof and successor-serving status,
#     zero operator calls, followed by EVERY observed ACK read back.
# P3: operator mode remains explicit, never an automatic fallback.
# P4: a new guest on the selected successor connects over 127.0.0.1, verifies
#     every ACK (allowing only the recorded later-unacked overwrite), and
#     the in-scenario dropped-write control must catch a missing ACKed write.
# P4b: RF2 cannot ACK while r1 is off; a new guest there must observe refusal.
# P5: r1 powers on, never serves as primary, rejoins and reaches Healthy in
#     the selected primary's peer view. The old guest is not restarted.
# P6: the new guest writes again, exports its ACKs off-host, verifies all old
#     and new ACKs. A mismatch or a missing required round fails the row.
# Replicas: RF3 r1=node-2/r2=node-1/r3=node-3; RF2 r1=node-2/r2=node-3.
# blockmaster is on node-1, never on the lost primary. Product and runner
# sources, binaries, per-node SSH pins, mutual TLS and unit ownership are
# checked as before. The controller is an observer, not a cross-host guest.
# Own roots/units/NQN are run-ID scoped; always collect journals and off-host
# ledger before teardown. Cloud controller destroys VMs after any row failure.
# No external NVMe bind, VIP, multipath to another holder or implicit migration.

name: v3block-r4-node-loss
timeout: 60m
always_timeout: 10m

env:
  rf: "3"
  product_src: ""
  runner_src: ""
  product_head: ""        # the final release candidate (40 hex)
  runner_head: ""         # the runner commit this scenario and r4.sh come from (40 hex)
  n1_ip: ""
  n2_ip: ""
  n3_ip: ""
  n1_data: ""
  n2_data: ""
  n3_data: ""
  n1_host_key: ""
  n2_host_key: ""
  n3_host_key: ""
  ssh_user: "seaweed"
  ssh_key: ""
  hold_seconds: "240"
  failover_mode: "automatic" # operator is explicit, for a round that cannot decide
  writes: "64"
  master_port: "19600"
  data_port: "19601"
  ctrl_port: "19602"
  status_port: "19603"
  nvme_port: "4420"

topology:
  nodes:
    controller: { is_native: true }
    node-1: { host: "{{ n1_ip }}", user: "{{ ssh_user }}", key: "{{ ssh_key }}", host_key: "{{ n1_host_key }}" }
    node-2: { host: "{{ n2_ip }}", user: "{{ ssh_user }}", key: "{{ ssh_key }}", host_key: "{{ n2_host_key }}" }
    node-3: { host: "{{ n3_ip }}", user: "{{ ssh_user }}", key: "{{ ssh_key }}", host_key: "{{ n3_host_key }}" }

phases:
  - name: preflight
    actions:
      - action: exec
        node: controller
        timeout: 60s
        env.SRC: "{{ product_src }}"
        env.HEAD: "{{ product_head }}"
        env.RS: "{{ runner_src }}"
        env.RHEAD: "{{ runner_head }}"
        env.RF: "{{ rf }}"
        env.MODE: "{{ failover_mode }}"
        cmd: |
          python3 - <<'PY'
          import os,re,subprocess
          def show(repo,sha,path):
              if not re.fullmatch('[0-9a-f]{40}',sha): raise SystemExit('full source pin required')
              return subprocess.check_output(['git','-C',repo,'show',sha+':'+path],text=True,timeout=20)
          src,head,rs,rhead=(os.environ[k] for k in ('SRC','HEAD','RS','RHEAD'))
          assert os.environ['RF'] in ('2','3'), 'rf must be 2 or 3'
          assert os.environ['MODE'] in ('automatic','operator'), 'invalid failover_mode'
          files={p:show(src,head,p) for p in ('cmd/blockvolume/main.go','cmd/blockmaster/main.go','cmd/sw-block/failover.go','docs/standalone-deployment.md','deploy/systemd/sw-blockvolume.service')}
          for flag in ('master-tls-cert','master-tls-key','master-ca','nvme-listen','replication-ack'):
              assert '"'+flag+'"' in files['cmd/blockvolume/main.go'], 'removed volume flag '+flag
          for flag in ('failback-runtime-rpc','tls-cert','role-file','audit-log','launcher-replication-ack','lifecycle-product-loop-interval'):
              assert '"'+flag+'"' in files['cmd/blockmaster/main.go'], 'removed master flag '+flag
          for flag in ('target-data','target-ctrl','expect-current','confirm-old-node-off'):
              assert '"'+flag+'"' in files['cmd/sw-block/failover.go'], 'removed failover flag '+flag
          assert 'RestartPreventExitStatus=78' in files['deploy/systemd/sw-blockvolume.service']
          from pathlib import Path
          for p in ('scenarios/v3block/r4-node-loss.yaml','scenarios/v3block/r4.sh','scripts/r4/auto-p2.py','scripts/r4/guest-io.py'):
              assert Path(rs,p).read_text()==show(rs,rhead,p), 'runner working copy differs from pin: '+p
          print('PREFLIGHT PASS product='+head+' runner='+rhead+' rf='+os.environ['RF'])
          PY
  - name: build
    actions:
      # Binaries and certificates are made once on the controller, from the
      # pinned commits (git archive / git show, never the working tree), and
      # uploaded (the runner repository is private: no fetch on the VMs).
      - action: exec
        node: controller
        timeout: 20m
        env.SRC: "{{ product_src }}"
        env.HEAD: "{{ product_head }}"
        env.RS: "{{ runner_src }}"
        env.RHEAD: "{{ runner_head }}"
        env.L: "/tmp/r4-{{ run_id }}-rf{{ rf }}"
        cmd: |
          set -eu
          hex40() { printf '%s' "$1" | grep -Eqx '[0-9a-f]{40}'; }
          hex40 "$HEAD" || { echo "product_head is not a full sha" >&2; exit 2; }
          hex40 "$RHEAD" || { echo "runner_head is not a full sha" >&2; exit 2; }
          git -C "$SRC" cat-file -e "$HEAD^{commit}"
          git -C "$RS" cat-file -e "$RHEAD^{commit}"
          git -C "$RS" diff --quiet "$RHEAD" -- scenarios/v3block/r4-node-loss.yaml || { echo "the scenario being run is not runner_head's" >&2; exit 2; }
          [ ! -e "$L" ] || { echo "$L exists: not fresh work" >&2; exit 2; }
          mkdir -p "$L/src" "$L/pkg/bin"
          git -C "$SRC" archive -o "$L/src.tar" "$HEAD" && tar -xf "$L/src.tar" -C "$L/src"
          for b in blockmaster blockvolume sw-block; do (cd "$L/src" && CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$L/pkg/bin/$b" ./cmd/$b); done
          git -C "$RS" show "$RHEAD:scenarios/v3block/r4.sh" > "$L/pkg/r4.sh"
          git -C "$RS" show "$RHEAD:scripts/r4/auto-p2.py" > "$L/pkg/auto-p2.py"
          git -C "$RS" show "$RHEAD:scripts/r4/guest-io.py" > "$L/pkg/guest-io.py"
          # Development certificates from the product's script (files only):
          # blockmaster's carries DNS:blockmaster, so every node maps that
          # name to node-1's private address and dials blockmaster by name.
          SW_BLOCK_TLS_APPLY=0 bash "$L/src/scripts/k8s-alpha-certs.sh" standalone "$L/pkg/tls" s1 s2 s3 >/dev/null
          (cd "$L/pkg" && find . -type f ! -name SHA256SUMS | LC_ALL=C sort | xargs sha256sum > SHA256SUMS)
          tar -C "$L/pkg" -czf "$L/r4-pkg.tgz" .
          { echo "product_head=$HEAD"; echo "runner_head=$RHEAD"; go version
            grep -E ' \./(bin/|r4\.sh|auto-p2\.py|guest-io\.py)' "$L/pkg/SHA256SUMS"; sha256sum "$L/r4-pkg.tgz" | sed "s#$L/##"; } > "$L/provenance.txt"
          cat "$L/provenance.txt"
      - {action: upload_path, node: node-1, path: "/tmp/r4-{{ run_id }}-rf{{ rf }}/r4-pkg.tgz", dest: "/tmp/r4-{{ run_id }}-rf{{ rf }}.tgz"}
      - {action: upload_path, node: node-2, path: "/tmp/r4-{{ run_id }}-rf{{ rf }}/r4-pkg.tgz", dest: "/tmp/r4-{{ run_id }}-rf{{ rf }}.tgz"}
      - {action: upload_path, node: node-3, path: "/tmp/r4-{{ run_id }}-rf{{ rf }}/r4-pkg.tgz", dest: "/tmp/r4-{{ run_id }}-rf{{ rf }}.tgz"}
      # Fresh work on every host, the package checked against its SHA256SUMS.
      - {action: exec, node: node-1, cmd: "T={{ run_id }}-rf{{ rf }}; X=/tmp/r4-$T-x; mkdir $X && tar -xzf /tmp/r4-$T.tgz -C $X && sudo bash $X/r4.sh install $X $T {{ n1_data }}"}
      - {action: exec, node: node-2, cmd: "T={{ run_id }}-rf{{ rf }}; X=/tmp/r4-$T-x; mkdir $X && tar -xzf /tmp/r4-$T.tgz -C $X && sudo bash $X/r4.sh install $X $T {{ n1_data }}"}
      - {action: exec, node: node-3, cmd: "T={{ run_id }}-rf{{ rf }}; X=/tmp/r4-$T-x; mkdir $X && tar -xzf /tmp/r4-$T.tgz -C $X && sudo bash $X/r4.sh install $X $T {{ n1_data }}"}
      # Initial and replacement guests use the holder's local kernel target.
      - {action: exec, node: node-1, cmd: "sudo bash /var/lib/r4/{{ run_id }}-rf{{ rf }}/r4.sh client-check"}
      - {action: exec, node: node-2, cmd: "sudo bash /var/lib/r4/{{ run_id }}-rf{{ rf }}/r4.sh client-check"}
      - {action: exec, node: node-3, cmd: "sudo bash /var/lib/r4/{{ run_id }}-rf{{ rf }}/r4.sh client-check"}
      - action: exec
        node: controller
        cmd: >-
          L=/tmp/r4-{{ run_id }}-rf{{ rf }};
          python3 $L/pkg/guest-io.py --config $L/guest/config.json init
          --tag {{ run_id }}-rf{{ rf }} --rf {{ rf }} --user '{{ ssh_user }}' --key '{{ ssh_key }}'
          --node node-1 '{{ n1_ip }}' '{{ n1_data }}' '{{ n1_host_key }}'
          --node node-2 '{{ n2_ip }}' '{{ n2_data }}' '{{ n2_host_key }}'
          --node node-3 '{{ n3_ip }}' '{{ n3_data }}' '{{ n3_host_key }}'
          --data-port {{ data_port }} --nvme-port {{ nvme_port }} --writes {{ writes }}

  - name: start
    actions:
      # blockmaster on node-1, the volume's replicas per rf, each as the run's
      # own persistent unit (see the header).
      - action: exec
        node: node-1
        timeout: 2m
        cmd: >-
          T={{ run_id }}-rf{{ rf }}; W=/var/lib/r4/$T;
          sudo bash $W/r4.sh spec $T {{ rf }} {{ n1_data }} {{ n2_data }} {{ n3_data }} {{ data_port }} {{ ctrl_port }} &&
          sudo bash $W/r4.sh unit $T master -- $W/bin/blockmaster
          --authority-store $W/master/authority --lifecycle-store $W/master/lifecycle
          --cluster-spec $W/cluster-spec.yaml --expected-slots-per-volume {{ rf }}
          --lifecycle-product-loop-interval 100ms
          --launcher-replication-ack sync-quorum --listen 0.0.0.0:{{ master_port }}
          --tls-cert $W/tls/master.crt --tls-key $W/tls/master.key --tls-client-ca $W/tls/ca.crt
          --role-file $W/tls/roles --audit-log $W/master/audit.jsonl --failback-runtime-rpc &&
          sudo bash $W/r4.sh start $T master
      - action: exec
        node: node-2
        timeout: 2m
        cmd: >-
          T={{ run_id }}-rf{{ rf }}; W=/var/lib/r4/$T;
          sudo bash $W/r4.sh unit $T volume -- $W/bin/blockvolume --master blockmaster:{{ master_port }}
          --server-id s2 --volume-id v1 --replica-id r1
          --data-addr {{ n2_data }}:{{ data_port }} --ctrl-addr {{ n2_data }}:{{ ctrl_port }} --status-addr 127.0.0.1:{{ status_port }}
          --durable-root $W/vol --durable-impl walstore --durable-blocks 65536 --durable-blocksize 4096 --replication-ack sync-quorum
          --nvme-listen 127.0.0.1:{{ nvme_port }} --nvme-subsysnqn nqn.2026-11.io.seaweedfs:r4-$T
          --master-tls-cert $W/tls/node-s2.crt --master-tls-key $W/tls/node-s2.key --master-ca $W/tls/ca.crt &&
          sudo bash $W/r4.sh start $T volume
      - action: exec
        node: node-3
        timeout: 2m
        cmd: >-
          T={{ run_id }}-rf{{ rf }}; W=/var/lib/r4/$T; R=$([ {{ rf }} = 3 ] && echo r3 || echo r2);
          sudo bash $W/r4.sh unit $T volume -- $W/bin/blockvolume --master blockmaster:{{ master_port }}
          --server-id s3 --volume-id v1 --replica-id $R
          --data-addr {{ n3_data }}:{{ data_port }} --ctrl-addr {{ n3_data }}:{{ ctrl_port }} --status-addr 127.0.0.1:{{ status_port }}
          --durable-root $W/vol --durable-impl walstore --durable-blocks 65536 --durable-blocksize 4096 --replication-ack sync-quorum
          --nvme-listen 127.0.0.1:{{ nvme_port }} --nvme-subsysnqn nqn.2026-11.io.seaweedfs:r4-$T
          --master-tls-cert $W/tls/node-s3.crt --master-tls-key $W/tls/node-s3.key --master-ca $W/tls/ca.crt &&
          sudo bash $W/r4.sh start $T volume
      - action: exec
        node: node-1
        timeout: 2m
        cmd: >-
          [ {{ rf }} = 3 ] || exit 0; T={{ run_id }}-rf{{ rf }}; W=/var/lib/r4/$T;
          sudo bash $W/r4.sh unit $T volume -- $W/bin/blockvolume --master blockmaster:{{ master_port }}
          --server-id s1 --volume-id v1 --replica-id r2
          --data-addr {{ n1_data }}:{{ data_port }} --ctrl-addr {{ n1_data }}:{{ ctrl_port }} --status-addr 127.0.0.1:{{ status_port }}
          --durable-root $W/vol --durable-impl walstore --durable-blocks 65536 --durable-blocksize 4096 --replication-ack sync-quorum
          --nvme-listen 127.0.0.1:{{ nvme_port }} --nvme-subsysnqn nqn.2026-11.io.seaweedfs:r4-$T
          --master-tls-cert $W/tls/node-s1.crt --master-tls-key $W/tls/node-s1.key --master-ca $W/tls/ca.crt &&
          sudo bash $W/r4.sh start $T volume
      # r1 primary at epoch 1 (creation complete: its first ready answer).
      - {action: exec, node: node-2, timeout: 3m, cmd: "bash /var/lib/r4/{{ run_id }}-rf{{ rf }}/r4.sh wait-role 'curl -sf --max-time 5 http://127.0.0.1:{{ status_port }}/status?volume=v1' primary 1 150"}

  - name: write-before-loss
    actions:
      - {action: exec, node: controller, timeout: 5m, cmd: "L=/tmp/r4-{{ run_id }}-rf{{ rf }}; python3 $L/pkg/guest-io.py --config $L/guest/config.json before"}

  - name: writer-through-loss
    actions:
      - {action: exec, node: controller, timeout: 2m, cmd: "L=/tmp/r4-{{ run_id }}-rf{{ rf }}; python3 $L/pkg/guest-io.py --config $L/guest/config.json stream-start"}

  - name: lose-the-primary
    actions:
      - {action: cloud_vm_power, node: node-1, vm: node-2}
      - {action: exec, node: controller, timeout: 90s, cmd: "L=/tmp/r4-{{ run_id }}-rf{{ rf }}; python3 $L/pkg/guest-io.py --config $L/guest/config.json stream-ended --fault-dispatch-unix-ns {{ __fault_dispatch_unix_ns }} --fault-key '{{ __fault_key }}'"}

  - name: operator-call-count
    actions:
      - {action: exec, node: node-1, cmd: "printf '0\\n' | sudo tee /var/lib/r4/{{ run_id }}-rf{{ rf }}/operator-calls >/dev/null"}

  # Only explicit operator mode may wait for an undecidable automatic round.
  - name: hold
    parallel: true
    actions:
      - action: exec                                             # r3 (rf=3) / r2 (rf=2)
        node: node-3
        timeout: 10m
        cmd: "[ '{{ failover_mode }}' = operator ] || exit 0; bash /var/lib/r4/{{ run_id }}-rf{{ rf }}/r4.sh held 'curl -sf --max-time 5 http://127.0.0.1:{{ status_port }}/status?volume=v1' -- {{ hold_seconds }} 1"
      - action: exec                                             # r2 (rf=3 only)
        node: node-1
        timeout: 10m
        cmd: "[ '{{ failover_mode }}' = operator ] && [ {{ rf }} = 3 ] || exit 0; bash /var/lib/r4/{{ run_id }}-rf{{ rf }}/r4.sh held 'curl -sf --max-time 5 http://127.0.0.1:{{ status_port }}/status?volume=v1' -- {{ hold_seconds }} 1"

  - name: operator-failover
    actions:
      - action: exec                                             # P3
        node: node-1
        timeout: 3m
        cmd: |
          bash -e -o pipefail <<'R4STEP'
          [ '{{ failover_mode }}' = operator ] || exit 0
          printf '1\n' | sudo tee /var/lib/r4/{{ run_id }}-rf{{ rf }}/operator-calls >/dev/null
          T={{ run_id }}-rf{{ rf }}; W=/var/lib/r4/$T; DATA=$([ {{ rf }} = 3 ] && echo {{ n1_data }} || echo {{ n3_data }}); sudo env SW_BLOCK_TLS_CERT=$W/tls/failback-executor.crt SW_BLOCK_TLS_KEY=$W/tls/failback-executor.key SW_BLOCK_TLS_CA=$W/tls/ca.crt $W/bin/sw-block ops failover --master blockmaster:{{ master_port }} --volume v1 --target r2 --target-data "$DATA:{{ data_port }}" --target-ctrl "$DATA:{{ ctrl_port }}" --expect-current r1@1 --confirm-old-node-off v1 | sudo tee $W/failover.txt
          R4STEP

  - name: fenced-successor
    actions:
      - action: exec
        node: node-1
        timeout: 6m
        save_as: promotion
        cmd: >-
          T={{ run_id }}-rf{{ rf }}; W=/var/lib/r4/$T;
          DATA=$([ {{ rf }} = 3 ] && echo {{ n1_data }} || echo {{ n3_data }});
          EXTRA=$([ {{ rf }} = 3 ] && echo '--candidate r3={{ n3_data }}:{{ data_port }}' || true);
          sudo python3 $W/auto-p2.py wait --authority $W/master/authority/v1.v3auth.json
          --seconds {{ hold_seconds }} --mode {{ failover_mode }} --calls $W/operator-calls
          --candidate r2=$DATA:{{ data_port }} $EXTRA --out $W/promotion.json
      - action: exec
        node: node-1
        timeout: 3m
        env.PROMOTION: "{{ promotion }}"
        cmd: "[ {{ rf }} = 3 ] || exit 0; W=/var/lib/r4/{{ run_id }}-rf{{ rf }}; sudo python3 $W/auto-p2.py status \"$PROMOTION\" r2 http://127.0.0.1:{{ status_port }}/status?volume=v1 $W/successor-status.json"
      - action: exec
        node: node-3
        timeout: 3m
        env.PROMOTION: "{{ promotion }}"
        cmd: "W=/var/lib/r4/{{ run_id }}-rf{{ rf }}; R=$([ {{ rf }} = 3 ] && echo r3 || echo r2); sudo python3 $W/auto-p2.py status \"$PROMOTION\" $R http://127.0.0.1:{{ status_port }}/status?volume=v1 $W/successor-status.json"
      - action: exec # New guest on the selected successor: P2 readback + P4 control
        node: controller
        timeout: 6m
        env.PROMOTION: "{{ promotion }}"
        cmd: "L=/tmp/r4-{{ run_id }}-rf{{ rf }}; python3 $L/pkg/guest-io.py --config $L/guest/config.json verify"
      - action: exec # P4b, RF2 only, executed on its successor's host
        node: controller
        timeout: 2m
        env.PROMOTION: "{{ promotion }}"
        cmd: "L=/tmp/r4-{{ run_id }}-rf{{ rf }}; python3 $L/pkg/guest-io.py --config $L/guest/config.json no-ack"

  - name: rejoin
    actions:
      - action: cloud_vm_power_restore                           # P5: a new boot
        node: node-1
        vm: node-2                  # the VM powered off in P1
      # The unit file survived the power loss (written and synced at start);
      # it is not enabled, so the blockvolume starts here, not at boot.
      - {action: exec, node: node-2, timeout: 2m, cmd: "sudo bash /var/lib/r4/{{ run_id }}-rf{{ rf }}/r4.sh start {{ run_id }}-rf{{ rf }} volume"}
      - {action: exec, node: node-2, timeout: 5m, cmd: "T={{ run_id }}-rf{{ rf }}; W=/var/lib/r4/$T; bash $W/r4.sh wait-role 'curl -sf --max-time 5 http://127.0.0.1:{{ status_port }}/status?volume=v1' replica 2 240 && sudo curl -sf --max-time 5 'http://127.0.0.1:{{ status_port }}/status?volume=v1' -o $W/old-rejoin-status.json"}
      - action: exec
        node: node-1
        timeout: 5m
        env.PROMOTION: "{{ promotion }}"
        cmd: "[ {{ rf }} = 3 ] || exit 0; W=/var/lib/r4/{{ run_id }}-rf{{ rf }}; sudo python3 $W/auto-p2.py peers \"$PROMOTION\" r2 http://127.0.0.1:{{ status_port }}/status/peers?volume=v1 $W/rejoin-peers.json"
      - action: exec
        node: node-3
        timeout: 5m
        env.PROMOTION: "{{ promotion }}"
        cmd: "W=/var/lib/r4/{{ run_id }}-rf{{ rf }}; R=$([ {{ rf }} = 3 ] && echo r3 || echo r2); sudo python3 $W/auto-p2.py peers \"$PROMOTION\" $R http://127.0.0.1:{{ status_port }}/status/peers?volume=v1 $W/rejoin-peers.json"
      - action: exec # P6: new guest writes, exports ACKs off-host, verifies all
        node: controller
        timeout: 6m
        env.PROMOTION: "{{ promotion }}"
        cmd: "L=/tmp/r4-{{ run_id }}-rf{{ rf }}; python3 $L/pkg/guest-io.py --config $L/guest/config.json after-rejoin"

  - name: collect
    always: true
    actions:
      - {action: exec, node: controller, cmd: 'L=/tmp/r4-{{ run_id }}-rf{{ rf }}; [ ! -f "$L/guest/config.json" ] || python3 "$L/pkg/guest-io.py" --config "$L/guest/config.json" cleanup'}
      - {action: collect_path, node: controller, path: "/tmp/r4-{{ run_id }}-rf{{ rf }}/guest", name: "off-host-guest-ledger"}
      # Capture and archive journals BEFORE stopping/removing units, on every exit.
      # Retain host work if collection fails; the cloud controller owns VM teardown.
      - {action: exec, node: node-1, cmd: "T={{ run_id }}-rf{{ rf }}; S=/var/lib/r4/$T/r4.sh; [ -f $S ] || S=/tmp/r4-$T-x/r4.sh; [ -f $S ] || { echo nothing installed; exit 0; }; sudo bash $S evidence $T"}
      - {action: exec, node: node-2, cmd: "T={{ run_id }}-rf{{ rf }}; S=/var/lib/r4/$T/r4.sh; [ -f $S ] || S=/tmp/r4-$T-x/r4.sh; [ -f $S ] || { echo nothing installed; exit 0; }; sudo bash $S evidence $T"}
      - {action: exec, node: node-3, cmd: "T={{ run_id }}-rf{{ rf }}; S=/var/lib/r4/$T/r4.sh; [ -f $S ] || S=/tmp/r4-$T-x/r4.sh; [ -f $S ] || { echo nothing installed; exit 0; }; sudo bash $S evidence $T"}
      - {action: collect_path, node: node-1, path: "/var/lib/r4/{{ run_id }}-rf{{ rf }}/evidence", name: "node-1-evidence"}
      - {action: collect_path, node: node-2, path: "/var/lib/r4/{{ run_id }}-rf{{ rf }}/evidence", name: "node-2-evidence"}
      - {action: collect_path, node: node-3, path: "/var/lib/r4/{{ run_id }}-rf{{ rf }}/evidence", name: "node-3-evidence"}
      - {action: collect_path, node: controller, path: "/tmp/r4-{{ run_id }}-rf{{ rf }}/provenance.txt"}
