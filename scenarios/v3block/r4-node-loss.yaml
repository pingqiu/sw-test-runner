# R4 documented standalone: NVMe guest on its holder's host, loopback only.
# node-2 starts r1 and the guest; abrupt VM power loss takes both down.
# The controller synchronously fsyncs the intent/ACK ledger over pinned SSH,
# outside that VM. No next write or observed ACK precedes its durable receipt.
# P1: one host power-off, including its guest; the off-host ledger survives.
# P2: automatic persisted BasisFenced/e+1 proof and successor-serving status,
#     zero operator calls, followed by EVERY observed ACK read back.
# P3: operator mode remains explicit, never an automatic fallback.
# P4: a new guest on the selected successor connects over 127.0.0.1, verifies
#     every ACK (allowing only the recorded later-unacked overwrite), and
#     the in-scenario dropped-write control must catch a missing ACKed write.
# P4b: RF2 cannot ACK while r1 is off; a new guest there must observe refusal.
# P5: r1 powers on, never serves as primary, rejoins and reaches Healthy in
#     the selected primary's peer view. The old guest is not restarted.
# P6: the new guest writes again, exports its ACKs off-host, verifies all old
#     and new ACKs. A mismatch or a missing required round fails the row.
# Replicas: RF3 r1=node-2/r2=node-1/r3=node-3; RF2 r1=node-2/r2=node-3.
# blockmaster is on node-1, never on the lost primary. Product and runner
# sources, binaries, per-node SSH pins, mutual TLS and unit ownership are
# checked as before. The controller is an observer, not a cross-host guest.
# Own roots/units/NQN are run-ID scoped; always collect journals and off-host
# ledger before teardown. Cloud controller destroys VMs after any row failure.
# No external NVMe bind, VIP, multipath to another holder or implicit migration.

name: v3block-r4-node-loss
timeout: 60m
always_timeout: 10m

env:
  rf: "3"
  product_src: ""
  runner_src: ""
  product_head: ""        # the final release candidate (40 hex)
  runner_head: ""         # the runner commit this scenario and r4.sh come from (40 hex)
  n1_ip: ""
  n2_ip: ""
  n3_ip: ""
  n1_data: ""
  n2_data: ""
  n3_data: ""
  n1_host_key: ""
  n2_host_key: ""
  n3_host_key: ""
  ssh_user: "seaweed"
  ssh_key: ""
  hold_seconds: "240"
  failover_mode: "automatic" # operator is explicit, for a round that cannot decide
  writes: "64"
  master_port: "19600"
  data_port: "19601"
  ctrl_port: "19602"
  status_port: "19603"
  nvme_port: "4420"

topology:
  nodes:
    controller: { is_native: true }
    node-1: { host: "{{ n1_ip }}", user: "{{ ssh_user }}", key: "{{ ssh_key }}", host_key: "{{ n1_host_key }}" }
    node-2: { host: "{{ n2_ip }}", user: "{{ ssh_user }}", key: "{{ ssh_key }}", host_key: "{{ n2_host_key }}" }
    node-3: { host: "{{ n3_ip }}", user: "{{ ssh_user }}", key: "{{ ssh_key }}", host_key: "{{ n3_host_key }}" }

phases:
  - include: includes/r4-standalone-start.yaml

  - name: write-before-loss
    actions:
      - {action: exec, node: controller, timeout: 5m, cmd: "L=/tmp/r4-{{ run_id }}-rf{{ rf }}; python3 $L/pkg/guest-io.py --config $L/guest/config.json before"}

  - name: writer-through-loss
    actions:
      - {action: exec, node: controller, timeout: 2m, cmd: "L=/tmp/r4-{{ run_id }}-rf{{ rf }}; python3 $L/pkg/guest-io.py --config $L/guest/config.json stream-start"}

  - name: lose-the-primary
    actions:
      - {action: cloud_vm_power, node: node-1, vm: node-2}
      - {action: exec, node: controller, timeout: 90s, cmd: "L=/tmp/r4-{{ run_id }}-rf{{ rf }}; python3 $L/pkg/guest-io.py --config $L/guest/config.json stream-ended --fault-dispatch-unix-ns {{ __fault_dispatch_unix_ns }} --fault-key '{{ __fault_key }}'"}

  - name: operator-call-count
    actions:
      - {action: exec, node: node-1, cmd: "printf '0\\n' | sudo tee /var/lib/r4/{{ run_id }}-rf{{ rf }}/operator-calls >/dev/null"}

  # Only explicit operator mode may wait for an undecidable automatic round.
  - name: hold
    parallel: true
    actions:
      - action: exec                                             # r3 (rf=3) / r2 (rf=2)
        node: node-3
        timeout: 10m
        cmd: "[ '{{ failover_mode }}' = operator ] || exit 0; bash /var/lib/r4/{{ run_id }}-rf{{ rf }}/r4.sh held 'curl -sf --max-time 5 http://127.0.0.1:{{ status_port }}/status?volume=v1' -- {{ hold_seconds }} 1"
      - action: exec                                             # r2 (rf=3 only)
        node: node-1
        timeout: 10m
        cmd: "[ '{{ failover_mode }}' = operator ] && [ {{ rf }} = 3 ] || exit 0; bash /var/lib/r4/{{ run_id }}-rf{{ rf }}/r4.sh held 'curl -sf --max-time 5 http://127.0.0.1:{{ status_port }}/status?volume=v1' -- {{ hold_seconds }} 1"

  - name: operator-failover
    actions:
      - action: exec                                             # P3
        node: node-1
        timeout: 3m
        cmd: |
          bash -e -o pipefail <<'R4STEP'
          [ '{{ failover_mode }}' = operator ] || exit 0
          printf '1\n' | sudo tee /var/lib/r4/{{ run_id }}-rf{{ rf }}/operator-calls >/dev/null
          T={{ run_id }}-rf{{ rf }}; W=/var/lib/r4/$T; DATA=$([ {{ rf }} = 3 ] && echo {{ n1_data }} || echo {{ n3_data }}); sudo env SW_BLOCK_TLS_CERT=$W/tls/failback-executor.crt SW_BLOCK_TLS_KEY=$W/tls/failback-executor.key SW_BLOCK_TLS_CA=$W/tls/ca.crt $W/bin/sw-block ops failover --master blockmaster:{{ master_port }} --volume v1 --target r2 --target-data "$DATA:{{ data_port }}" --target-ctrl "$DATA:{{ ctrl_port }}" --expect-current r1@1 --confirm-old-node-off v1 | sudo tee $W/failover.txt
          R4STEP

  - name: fenced-successor
    actions:
      - action: exec
        node: node-1
        timeout: 6m
        save_as: promotion
        cmd: >-
          T={{ run_id }}-rf{{ rf }}; W=/var/lib/r4/$T;
          DATA=$([ {{ rf }} = 3 ] && echo {{ n1_data }} || echo {{ n3_data }});
          EXTRA=$([ {{ rf }} = 3 ] && echo '--candidate r3={{ n3_data }}:{{ data_port }}' || true);
          sudo python3 $W/auto-p2.py wait --authority $W/master/authority/v1.v3auth.json
          --seconds {{ hold_seconds }} --mode {{ failover_mode }} --calls $W/operator-calls
          --candidate r2=$DATA:{{ data_port }} $EXTRA --out $W/promotion.json
      - action: exec
        node: node-1
        timeout: 3m
        env.PROMOTION: "{{ promotion }}"
        cmd: "[ {{ rf }} = 3 ] || exit 0; W=/var/lib/r4/{{ run_id }}-rf{{ rf }}; sudo python3 $W/auto-p2.py status \"$PROMOTION\" r2 http://127.0.0.1:{{ status_port }}/status?volume=v1 $W/successor-status.json"
      - action: exec
        node: node-3
        timeout: 3m
        env.PROMOTION: "{{ promotion }}"
        cmd: "W=/var/lib/r4/{{ run_id }}-rf{{ rf }}; R=$([ {{ rf }} = 3 ] && echo r3 || echo r2); sudo python3 $W/auto-p2.py status \"$PROMOTION\" $R http://127.0.0.1:{{ status_port }}/status?volume=v1 $W/successor-status.json"
      - action: exec # New guest on the selected successor: P2 readback + P4 control
        node: controller
        timeout: 6m
        env.PROMOTION: "{{ promotion }}"
        cmd: "L=/tmp/r4-{{ run_id }}-rf{{ rf }}; python3 $L/pkg/guest-io.py --config $L/guest/config.json verify"
      - action: exec # P4b, RF2 only, executed on its successor's host
        node: controller
        timeout: 2m
        env.PROMOTION: "{{ promotion }}"
        cmd: "L=/tmp/r4-{{ run_id }}-rf{{ rf }}; python3 $L/pkg/guest-io.py --config $L/guest/config.json no-ack"

  - name: rejoin
    actions:
      - action: cloud_vm_power_restore                           # P5: a new boot
        node: node-1
        vm: node-2                  # the VM powered off in P1
      # The unit file survived the power loss (written and synced at start);
      # it is not enabled, so the blockvolume starts here, not at boot.
      - {action: exec, node: node-2, timeout: 2m, cmd: "sudo bash /var/lib/r4/{{ run_id }}-rf{{ rf }}/r4.sh start {{ run_id }}-rf{{ rf }} volume"}
      - {action: exec, node: node-2, timeout: 5m, cmd: "T={{ run_id }}-rf{{ rf }}; W=/var/lib/r4/$T; bash $W/r4.sh wait-role 'curl -sf --max-time 5 http://127.0.0.1:{{ status_port }}/status?volume=v1' replica 2 240 && sudo curl -sf --max-time 5 'http://127.0.0.1:{{ status_port }}/status?volume=v1' -o $W/old-rejoin-status.json"}
      - action: exec
        node: node-1
        timeout: 5m
        env.PROMOTION: "{{ promotion }}"
        cmd: "[ {{ rf }} = 3 ] || exit 0; W=/var/lib/r4/{{ run_id }}-rf{{ rf }}; sudo python3 $W/auto-p2.py peers \"$PROMOTION\" r2 http://127.0.0.1:{{ status_port }}/status/peers?volume=v1 $W/rejoin-peers.json"
      - action: exec
        node: node-3
        timeout: 5m
        env.PROMOTION: "{{ promotion }}"
        cmd: "W=/var/lib/r4/{{ run_id }}-rf{{ rf }}; R=$([ {{ rf }} = 3 ] && echo r3 || echo r2); sudo python3 $W/auto-p2.py peers \"$PROMOTION\" $R http://127.0.0.1:{{ status_port }}/status/peers?volume=v1 $W/rejoin-peers.json"
      - action: exec # P6: new guest writes, exports ACKs off-host, verifies all
        node: controller
        timeout: 6m
        env.PROMOTION: "{{ promotion }}"
        cmd: "L=/tmp/r4-{{ run_id }}-rf{{ rf }}; python3 $L/pkg/guest-io.py --config $L/guest/config.json after-rejoin"

  - include: includes/r4-standalone-collect.yaml
