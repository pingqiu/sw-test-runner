name: known-zero-1tib-acceptance
timeout: 190m
always_timeout: 20m
env:
  run_id: ""
  rc_sha: ""
  archive_path: ""
  archive_sha256: ""
  source_host: ""
  target_host: ""
  ssh_user: ""
  ssh_key: ""
  source_host_key: ""
  target_host_key: ""
  source_root: ""
  target_root: ""
  source_ci_unit: ""
  target_ci_unit: ""
  min_free_bytes: ""
  helper_path: "scripts/kz/host.py"
  judge_path: "scripts/kz/judge.py"
topology:
  nodes:
    source:
      host: "{{.env.source_host}}"
      user: "{{.env.ssh_user}}"
      key: "{{.env.ssh_key}}"
      host_key: "{{.env.source_host_key}}"
    target:
      host: "{{.env.target_host}}"
      user: "{{.env.ssh_user}}"
      key: "{{.env.ssh_key}}"
      host_key: "{{.env.target_host_key}}"
phases:
  - name: fresh-roots
    parallel: true
    actions:
      - action: "exec"
        node: "source"
        timeout: "20s"
        cmd: "python3 -c 'import os,re; from pathlib import Path; p=Path(os.environ[\"KZ_ROOT\"]); r=os.environ[\"KZ_RUN\"]; assert re.fullmatch(r\"kz-[0-9]{8}t[0-9]{6}z\",r); assert re.fullmatch(r\"/[A-Za-z0-9_./-]+\",str(p)) and p.is_absolute() and p.resolve()==p and p.name==\"swb-\"+r; p.mkdir(mode=0o700)' "
        env.KZ_ROOT: "{{.env.source_root}}"
        env.KZ_RUN: "{{.env.run_id}}"
        env.KZ_ROLE: "source"
        env.KZ_SELF: "{{.env.source_host}}"
        env.KZ_PEER: "{{.env.target_host}}"
        env.KZ_RC: "{{.env.rc_sha}}"
        env.KZ_ARCHIVE_SHA: "{{.env.archive_sha256}}"
        env.KZ_CI_UNIT: "{{.env.source_ci_unit}}"
        env.KZ_MIN_FREE_BYTES: "{{.env.min_free_bytes}}"
      - action: "exec"
        node: "target"
        timeout: "20s"
        cmd: "python3 -c 'import os,re; from pathlib import Path; p=Path(os.environ[\"KZ_ROOT\"]); r=os.environ[\"KZ_RUN\"]; assert re.fullmatch(r\"kz-[0-9]{8}t[0-9]{6}z\",r); assert re.fullmatch(r\"/[A-Za-z0-9_./-]+\",str(p)) and p.is_absolute() and p.resolve()==p and p.name==\"swb-\"+r; p.mkdir(mode=0o700)' "
        env.KZ_ROOT: "{{.env.target_root}}"
        env.KZ_RUN: "{{.env.run_id}}"
        env.KZ_ROLE: "target"
        env.KZ_SELF: "{{.env.target_host}}"
        env.KZ_PEER: "{{.env.source_host}}"
        env.KZ_RC: "{{.env.rc_sha}}"
        env.KZ_ARCHIVE_SHA: "{{.env.archive_sha256}}"
        env.KZ_CI_UNIT: "{{.env.target_ci_unit}}"
        env.KZ_MIN_FREE_BYTES: "{{.env.min_free_bytes}}"
  - name: stage-pinned-inputs
    parallel: true
    actions:
      - action: "upload_path"
        node: "source"
        timeout: "4m"
        path: "{{.env.archive_path}}"
        dest: "{{.env.source_root}}/bins.tar"
      - action: "upload_path"
        node: "source"
        timeout: "4m"
        path: "{{.env.helper_path}}"
        dest: "{{.env.source_root}}/host.py"
      - action: "upload_path"
        node: "source"
        timeout: "4m"
        path: "{{.env.judge_path}}"
        dest: "{{.env.source_root}}/judge.py"
      - action: "upload_path"
        node: "target"
        timeout: "4m"
        path: "{{.env.archive_path}}"
        dest: "{{.env.target_root}}/bins.tar"
      - action: "upload_path"
        node: "target"
        timeout: "4m"
        path: "{{.env.helper_path}}"
        dest: "{{.env.target_root}}/host.py"
      - action: "upload_path"
        node: "target"
        timeout: "4m"
        path: "{{.env.judge_path}}"
        dest: "{{.env.target_root}}/judge.py"
  - name: admit-and-isolate-ci
    parallel: true
    actions:
      - action: "exec"
        node: "source"
        timeout: "4m"
        cmd: "python3 '{{.env.source_root}}/host.py' prepare"
        env.KZ_ROOT: "{{.env.source_root}}"
        env.KZ_RUN: "{{.env.run_id}}"
        env.KZ_ROLE: "source"
        env.KZ_SELF: "{{.env.source_host}}"
        env.KZ_PEER: "{{.env.target_host}}"
        env.KZ_RC: "{{.env.rc_sha}}"
        env.KZ_ARCHIVE_SHA: "{{.env.archive_sha256}}"
        env.KZ_CI_UNIT: "{{.env.source_ci_unit}}"
        env.KZ_MIN_FREE_BYTES: "{{.env.min_free_bytes}}"
      - action: "exec"
        node: "target"
        timeout: "4m"
        cmd: "python3 '{{.env.target_root}}/host.py' prepare"
        env.KZ_ROOT: "{{.env.target_root}}"
        env.KZ_RUN: "{{.env.run_id}}"
        env.KZ_ROLE: "target"
        env.KZ_SELF: "{{.env.target_host}}"
        env.KZ_PEER: "{{.env.source_host}}"
        env.KZ_RC: "{{.env.rc_sha}}"
        env.KZ_ARCHIVE_SHA: "{{.env.archive_sha256}}"
        env.KZ_CI_UNIT: "{{.env.target_ci_unit}}"
        env.KZ_MIN_FREE_BYTES: "{{.env.min_free_bytes}}"
  - name: source-start
    actions:
      - action: "exec"
        node: "source"
        timeout: "60s"
        cmd: "python3 '{{.env.source_root}}/host.py' start '{{.env.source_root}}'"
  - name: source-handoff
    actions:
      - action: "wait_exec_match"
        node: "source"
        timeout: "70m"
        cmd: "python3 '{{.env.source_root}}/host.py' handoff '{{.env.source_root}}'"
        match: "^HANDOFF [A-Za-z0-9+/]+={0,2}$"
        fail_match: "^DONE"
        interval: "15s"
        save_as: "handoff"
  - name: target-run
    actions:
      - action: "exec"
        node: "target"
        timeout: "60s"
        cmd: "python3 '{{.env.target_root}}/host.py' accept"
        env.KZ_ROOT: "{{.env.target_root}}"
        env.KZ_RUN: "{{.env.run_id}}"
        env.KZ_ROLE: "target"
        env.KZ_SELF: "{{.env.target_host}}"
        env.KZ_PEER: "{{.env.source_host}}"
        env.KZ_RC: "{{.env.rc_sha}}"
        env.KZ_ARCHIVE_SHA: "{{.env.archive_sha256}}"
        env.KZ_CI_UNIT: "{{.env.target_ci_unit}}"
        env.KZ_MIN_FREE_BYTES: "{{.env.min_free_bytes}}"
        env.KZ_HANDOFF_B64: "{{.params.handoff}}"
      - action: "exec"
        node: "target"
        timeout: "60s"
        cmd: "python3 '{{.env.target_root}}/host.py' start '{{.env.target_root}}'"
      - action: "wait_exec_match"
        node: "target"
        timeout: "110m"
        cmd: "python3 '{{.env.target_root}}/host.py' poll '{{.env.target_root}}'"
        match: "^DONE rc=0$"
        fail_match: "^DONE rc=([^0]|0[0-9])"
        interval: "15s"
  - name: target-judgment
    actions:
      - action: "exec"
        node: "target"
        timeout: "60s"
        cmd: "python3 '{{.env.target_root}}/judge.py' '{{.env.target_root}}/out/report.json' target '{{.env.run_id}}' '{{.env.target_root}}/out/exit.json'"
  - name: source-finish
    actions:
      - action: "exec"
        node: "source"
        timeout: "60s"
        cmd: "python3 '{{.env.source_root}}/host.py' done '{{.env.source_root}}'"
      - action: "wait_exec_match"
        node: "source"
        timeout: "10m"
        cmd: "python3 '{{.env.source_root}}/host.py' poll '{{.env.source_root}}'"
        match: "^DONE rc=0$"
        fail_match: "^DONE rc=([^0]|0[0-9])"
        interval: "15s"
      - action: "exec"
        node: "source"
        timeout: "60s"
        cmd: "python3 '{{.env.source_root}}/judge.py' '{{.env.source_root}}/out/report.json' source '{{.env.run_id}}' '{{.env.source_root}}/out/exit.json'"
  - name: settle-both-hosts
    always: true
    parallel: true
    actions:
      - action: "exec"
        node: "source"
        timeout: "6m"
        cmd: "python3 '{{.env.source_root}}/host.py' cleanup"
        env.KZ_ROOT: "{{.env.source_root}}"
        env.KZ_RUN: "{{.env.run_id}}"
        env.KZ_ROLE: "source"
        env.KZ_SELF: "{{.env.source_host}}"
        env.KZ_PEER: "{{.env.target_host}}"
        env.KZ_RC: "{{.env.rc_sha}}"
        env.KZ_ARCHIVE_SHA: "{{.env.archive_sha256}}"
        env.KZ_CI_UNIT: "{{.env.source_ci_unit}}"
        env.KZ_MIN_FREE_BYTES: "{{.env.min_free_bytes}}"
      - action: "exec"
        node: "target"
        timeout: "6m"
        cmd: "python3 '{{.env.target_root}}/host.py' cleanup"
        env.KZ_ROOT: "{{.env.target_root}}"
        env.KZ_RUN: "{{.env.run_id}}"
        env.KZ_ROLE: "target"
        env.KZ_SELF: "{{.env.target_host}}"
        env.KZ_PEER: "{{.env.source_host}}"
        env.KZ_RC: "{{.env.rc_sha}}"
        env.KZ_ARCHIVE_SHA: "{{.env.archive_sha256}}"
        env.KZ_CI_UNIT: "{{.env.target_ci_unit}}"
        env.KZ_MIN_FREE_BYTES: "{{.env.min_free_bytes}}"
  - name: collect-both-hosts
    always: true
    parallel: true
    actions:
      - action: "collect_path"
        node: "source"
        timeout: "3m"
        path: "{{.env.source_root}}/out"
        name: "known-zero-source"
      - action: "collect_path"
        node: "target"
        timeout: "3m"
        path: "{{.env.target_root}}/out"
        name: "known-zero-target"
